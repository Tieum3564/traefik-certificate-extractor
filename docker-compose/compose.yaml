services:
  extractor:
    build:
      context: ..
    image: tymat3564/certsextractor:latest
    restart: unless-stopped
    command: -c /app/source-one/${ACME_ONE_FILE:-acme.json} /app/source-two/${ACME_TWO_FILE:-acme.json} -r --include example.ovh exemple.ovh
    volumes:
      - ${ACME_ONE_DIR:?Set ACME_ONE_DIR to the first ACME directory}:/app/source-one:ro
      - ${ACME_TWO_DIR:?Set ACME_TWO_DIR to the second ACME directory}:/app/source-two:ro
      - ${CERTIFICATES_DIR:?Set CERTIFICATES_DIR to the output directory}:/app/certs
      - /var/run/docker.sock:/var/run/docker.sock